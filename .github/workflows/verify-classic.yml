name: Verify Classic Question Bank

on: push

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove obsolete Classic script tags
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("index.html")
          source = path.read_text(encoding="utf-8")
          for filename in [
              "question_expansion.js",
              "question_expansion_2.js",
              "question_expansion_3.js",
              "question_expansion_4.js",
          ]:
              source = re.sub(
                  rf"\\s*<script\\s+src=[\"']{re.escape(filename)}[\"']\\s*></script>",
                  "",
                  source,
                  flags=re.IGNORECASE,
              )
          path.write_text(source, encoding="utf-8")

      - name: Check Classic question JavaScript
        run: node --check questions.js

      - name: Check Classic question counts
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const source = fs.readFileSync('questions.js', 'utf8') + '\n;globalThis.__QUESTIONS = QUESTIONS;';
          const context = {};
          vm.runInNewContext(source, context);
          const questions = context.__QUESTIONS;
          if (!Array.isArray(questions)) throw new Error('QUESTIONS is not an array');
          const counts = questions.reduce((out, q) => {
            const d = String(q.difficulty || '').toLowerCase();
            out[d] = (out[d] || 0) + 1;
            return out;
          }, {});
          console.log('Classic question counts:', counts);
          for (const difficulty of ['easy', 'medium', 'hard']) {
            if (!counts[difficulty]) throw new Error(`No ${difficulty} Classic questions found`);
          }
          NODE

      - name: Commit verified setup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Use single Classic question bank"
          git push
