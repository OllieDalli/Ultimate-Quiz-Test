name: Debug quiz selection
on:
  push:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        run: |
          echo '--- CLASSIC SELECTION ---'
          sed -n '2440,2645p' app.js
          echo '--- WTA SELECTION ---'
          grep -nEi 'function .*Wta|function .*wta|WTA_QUESTIONS|wtaQuestions|getRandomWta|wta.*question|question.*wta' app.js question_types.js wta-fix.js | tail -250 || true
          echo '--- WTA FIX ---'
          cat wta-fix.js
          echo '--- QUESTIONS HEAD/HELPERS ---'
          sed -n '1,80p' questions.js
          tail -80 questions.js
          echo '--- QUESTION TYPES TAIL ---'
          tail -100 question_types.js
