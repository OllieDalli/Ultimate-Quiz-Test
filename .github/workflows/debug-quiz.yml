name: Debug quiz selection
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        run: |
          echo '--- FILES ---'
          find . -maxdepth 2 -type f | sort
          echo '--- APP MATCHES ---'
          grep -nEi 'difficulty|classic|wta|question' app.js | head -300 || true
          echo '--- QUESTION TYPES ---'
          grep -nEi 'difficulty|classic|wta|question' question_types.js | head -300 || true
          echo '--- SUPABASE ---'
          grep -nEi 'difficulty|classic|wta|question|script' supabase.js | head -300 || true
          echo '--- QUESTIONS HELPERS / SAMPLE ---'
          grep -nEi 'getQuestionsForDifficulty|getQuestionsForCategory|difficulty|category' questions.js | tail -100 || true
          echo '--- WTA FILES ---'
          for f in *wta* *WTA*; do [ -f "$f" ] && { echo "### $f"; grep -nEi 'difficulty|question|WTA|wta' "$f" | head -300 || true; }; done
