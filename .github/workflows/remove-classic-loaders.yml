name: Remove Obsolete Classic Loaders

on: push

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove deleted Classic script tags
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          source = path.read_text(encoding="utf-8")
          for filename in [
              "question_expansion.js",
              "question_expansion_2.js",
              "question_expansion_3.js",
              "question_expansion_4.js",
          ]:
              source = source.replace(f'<script src="{filename}"></script>\n', '')
              source = source.replace(f'<script src="{filename}"></script>', '')
          path.write_text(source, encoding="utf-8")

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Remove obsolete Classic question loaders"
          git push
