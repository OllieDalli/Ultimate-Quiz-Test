name: Apply quiz question-bank patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add expanded question scripts
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          old = '<script src="questions.js"></script>\n<script src="question_types.js"></script>'
          new = '<script src="questions.js"></script>\n<script src="question_expansion.js"></script>\n<script src="question_expansion_2.js"></script>\n<script src="question_expansion_3.js"></script>\n<script src="question_expansion_4.js"></script>\n<script src="question_types.js"></script>'
          if old in text:
              text = text.replace(old, new, 1)
              index.write_text(text)

          validator = Path('validate-questions.html')
          if validator.exists():
              text = validator.read_text()
              text = text.replace('<script src="questions.js"></script>', '<script src="questions.js"></script>\n<script src="question_expansion.js"></script>\n<script src="question_expansion_2.js"></script>\n<script src="question_expansion_3.js"></script>\n<script src="question_expansion_4.js"></script>', 1)
              text = text.replace("const required = ['Gaming','Music','TV and Film','History','General Knowledge','Science','Geography','Maths'];", "const required = ['Gaming','Music','TV and Film','History','General Knowledge','Science','Geography','Maths','Sport','Food & Drink','Animals & Nature','90s & 00s Nostalgia'];", 1)
              validator.write_text(text)
          PY

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-question-patch.yml
          git add index.html validate-questions.html
          git commit -m "Load expanded quiz question bank"
          git push
