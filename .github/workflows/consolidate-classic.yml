name: Consolidate Classic Questions

on: push

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Merge Classic question files
        shell: python
        run: |
          from pathlib import Path
          import json

          def extract_array(path, name):
              source = Path(path).read_text(encoding="utf-8")
              marker = f"const {name} ="
              start = source.find(marker)
              if start == -1:
                  raise RuntimeError(f"Could not find {marker} in {path}")
              payload = source[start + len(marker):].strip()
              if payload.endswith(";"):
                  payload = payload[:-1].rstrip()
              value = json.loads(payload)
              if not isinstance(value, list):
                  raise RuntimeError(f"{name} is not an array")
              return value

          questions = extract_array("questions.js", "QUESTIONS")

          expansion_files = [
              ("question_expansion.js", "EXPANDED_CLASSIC_QUESTIONS_1"),
              ("question_expansion_2.js", "EXPANDED_CLASSIC_QUESTIONS_2"),
              ("question_expansion_3.js", "EXPANDED_CLASSIC_QUESTIONS_3"),
              ("question_expansion_4.js", "EXPANDED_CLASSIC_QUESTIONS_4"),
          ]

          for path, name in expansion_files:
              questions.extend(extract_array(path, name))

          ids = [q.get("id") for q in questions]
          if any(not item for item in ids):
              raise RuntimeError("Every Classic question must have an id")
          if len(ids) != len(set(ids)):
              raise RuntimeError("Duplicate Classic question ids found")

          output = (
              "// ============================================================\n"
              "// THE ULTIMATE QUIZ — CLASSIC QUESTION BANK\n"
              "// All Classic questions are kept in this single file.\n"
              "// ============================================================\n\n"
              "const QUESTIONS = "
              + json.dumps(questions, ensure_ascii=False, separators=(",", ":"))
              + ";\n\n"
              "function getQuestionsForDifficulty(difficulty) {\n"
              "    const normalized = String(difficulty || \"\").trim().toLowerCase();\n"
              "    return QUESTIONS.filter(question =>\n"
              "        String(question?.difficulty || \"\").trim().toLowerCase() === normalized\n"
              "    );\n"
              "}\n"
          )

          Path("questions.js").write_text(output, encoding="utf-8")

          for path, _ in expansion_files:
              Path(path).unlink()

      - name: Commit consolidated bank
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add questions.js question_expansion.js question_expansion_2.js question_expansion_3.js question_expansion_4.js
          git diff --cached --quiet || git commit -m "Merge all Classic questions into one file"
          git push
