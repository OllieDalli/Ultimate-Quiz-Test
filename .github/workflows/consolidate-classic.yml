name: Finish Classic Question Bank Cleanup

on: push

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove old Classic loaders
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path("index.html")
          source = index.read_text(encoding="utf-8")

          for filename in [
              "question_expansion.js",
              "question_expansion_2.js",
              "question_expansion_3.js",
              "question_expansion_4.js",
          ]:
              source = re.sub(
                  rf"\\s*<script\\s+src=[\"']{re.escape(filename)}[\"']\\s*></script>",
                  "",
                  source,
                  flags=re.IGNORECASE,
              )

          index.write_text(source, encoding="utf-8")

          fix = Path("classic-difficulty-fix.js")
          if fix.exists():
              fix.unlink()

          workflow = Path(".github/workflows/consolidate-classic.yml")
          if workflow.exists():
              workflow.unlink()

      - name: Commit final Classic setup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Finish Classic question bank cleanup"
          git push
